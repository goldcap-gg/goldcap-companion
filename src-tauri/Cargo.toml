[package]
name = "goldcap-companion"
version = "1.2.1"
description = "GoldCap companion — automatic price sync for the GoldCap WoW addon"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
notify = "8"
# SavedVariables IS Lua. Evaluating it in a stripped-down VM is both shorter
# and more faithful than hand-rolling a parser for a format whose grammar is
# Blizzard's to change. The VM is built with NO stdlib and the file is loaded
# as data, so nothing in it can reach the filesystem or the network.
mlua = { version = "0.11", features = ["lua54", "vendored"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
