<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>GoldCap Companion — Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <h1>GoldCap Companion</h1>
      <p class="subtitle">Automatic price sync for the GoldCap addon.</p>

      <form id="settings-form">
        <label>
          WoW retail install path
          <div class="row">
            <input id="wowRetailPath" type="text" placeholder="C:\Program Files (x86)\World of Warcraft\_retail_" />
            <button type="button" id="detect-btn">Detect</button>
            <button type="button" id="browse-btn">Browse…</button>
          </div>
        </label>

        <label id="game-realms-label" hidden>
          Realm (found in game files)
          <select id="gameRealms">
            <option value="">— pick a realm —</option>
          </select>
        </label>

        <label>
          Region
          <select id="region">
            <option value="eu">EU</option>
            <option value="us">US</option>
          </select>
        </label>

        <label>
          Realm slug
          <input id="realmSlug" type="text" placeholder="dentarg" autocomplete="off" />
        </label>

        <label>
          Sync interval (minutes)
          <input id="intervalMinutes" type="number" min="1" step="1" />
        </label>

        <label class="checkbox-row">
          <input id="launchAtStartup" type="checkbox" />
          Launch at startup
        </label>

        <!-- Pairing is deliberately outside the Save flow: it exchanges a
             one-time code for a token immediately, and pressing Save
             afterwards must not be needed for it to take effect. -->
        <fieldset class="pairing">
          <legend>Upload to goldcap.gg</legend>
          <p class="pairing-hint">
            Pair once to upload your auction history automatically. Get a code
            at goldcap.gg/account — it is valid for 15 minutes.
          </p>
          <label>
            Pairing code
            <input
              id="pairCode"
              type="text"
              placeholder="ABCD-1234"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <div class="actions">
            <button type="button" id="pair-btn">Pair</button>
          </div>
          <p id="pair-status" class="status-line"></p>
        </fieldset>

        <div class="actions">
          <button type="button" id="sync-now-btn">Sync now</button>
          <button type="submit" id="save-btn">Save</button>
        </div>

        <p id="feedback" role="status" aria-live="polite"></p>
        <p id="status-line" class="status-line"></p>
      </form>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
