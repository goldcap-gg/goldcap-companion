<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>GoldCap Companion — Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <h1>GoldCap Companion</h1>
      <p class="subtitle">Automatic price sync for the GoldCap addon.</p>

      <form id="settings-form">
        <label>
          Region
          <select id="region">
            <option value="eu">EU</option>
            <option value="us">US</option>
          </select>
        </label>

        <label>
          Realm slug
          <input id="realmSlug" type="text" placeholder="dentarg" autocomplete="off" />
        </label>

        <label>
          WoW retail install path
          <div class="row">
            <input id="wowRetailPath" type="text" placeholder="/Applications/World of Warcraft/_retail_" />
            <button type="button" id="detect-btn">Detect</button>
          </div>
        </label>

        <label>
          Sync interval (minutes)
          <input id="intervalMinutes" type="number" min="1" step="1" />
        </label>

        <label class="checkbox-row">
          <input id="launchAtStartup" type="checkbox" />
          Launch at startup
        </label>

        <div class="actions">
          <button type="button" id="sync-now-btn">Sync now</button>
          <button type="submit" id="save-btn">Save</button>
        </div>

        <p id="feedback" role="status" aria-live="polite"></p>
        <p id="status-line" class="status-line"></p>
      </form>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
