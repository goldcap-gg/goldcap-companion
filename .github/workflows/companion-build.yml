name: Companion Build

# Builds an unsigned companion binary as a downloadable artifact, on demand and
# on every pull request. Windows is the one that matters (players run WoW there
# and won't have a Rust toolchain); the macOS DMG is built only where it is
# actually needed — companion-release.yml, on tagged releases — so a PR pays
# for one runner instead of two.
on:
  workflow_dispatch:
  pull_request:

# Cancel in-progress runs on new pushes to the same PR/ref — pushing three
# commits in a row shouldn't pay for three full builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: goldcap-companion-windows
    runs-on: ${{ matrix.os }}
    # Comfortably above the observed run time — this is here to stop a hung
    # job, not to fail a merely slow one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --locked

      # The updater pubkey in tauri.conf.json makes `tauri build` demand the
      # private key for the bundling step — without it the bundle hard-fails
      # ("A public key has been found, but no private key"). GitHub does not
      # hand repository secrets to a workflow triggered by a fork's pull
      # request, and this repo is public, so a fork PR cannot bundle. It still
      # gets the signal that matters (it compiles, the tests pass) from the
      # step below; bundling and the installer artifact are for PRs that can
      # see the key.
      - name: Build app bundle
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .

      - name: Compile only (fork pull request — no signing key available)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
